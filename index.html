<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الألعاب الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0b0f19; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="text-white font-sans h-full flex flex-col justify-between">

    <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-3xl border border-gray-700 w-full max-w-sm text-center space-y-4 shadow-2xl">
            <h2 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">🎮 المنصة المتطورة</h2>
            <input type="text" id="usernameInput" class="w-full p-3 rounded-xl bg-gray-700 border border-gray-600 text-center text-white" placeholder="اكتب اسمك المستعار...">
            <div class="text-right">
                <label class="text-sm text-gray-400 block mb-1">لون الدودة الخاص بك:</label>
                <input type="color" id="snakeColorInput" class="w-full h-11 p-1 rounded-xl bg-gray-700 border border-gray-600 cursor-pointer" value="#06b6d4">
            </div>
            <button onclick="connectToHub()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 font-bold p-3 rounded-xl transition transform hover:scale-105 shadow-lg">تسجيل الدخول</button>
        </div>
    </div>

    <div id="gameHub" class="hidden flex-1 flex flex-col lg:flex-row p-6 gap-6 h-full overflow-hidden">
        <div class="flex-1 bg-gray-800/60 backdrop-blur-md rounded-3xl p-6 border border-gray-700 flex flex-col justify-center items-center gap-6 text-center">
            <h1 class="text-4xl font-black text-blue-400">مجمع الغرف والرموز الخاصة 🌐</h1>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-full max-w-md">
                <button onclick="openGameMenu('xo')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xl font-bold p-5 rounded-2xl transition shadow-xl">❌⭕ غرف وجولات XO</button>
                <button onclick="openGameMenu('snake')" class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 text-xl font-bold p-5 rounded-2xl transition shadow-xl">🐍 غرفة الدودة والمغناطيس</button>
            </div>
        </div>
    </div>

    <div id="lobbyArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-700 text-center space-y-4">
            <h2 id="lobbyTitle" class="text-3xl font-black text-blue-400">إعداد الغرفة</h2>
            
            <div id="xoMenuOptions" class="hidden space-y-4">
                <div class="bg-gray-900/60 p-4 rounded-xl space-y-2">
                    <h4 class="text-xs text-gray-400 text-right">🤖 نمط فردي ضد البوت:</h4>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="startXOBotMode('easy')" class="bg-green-600 p-2 rounded-lg text-xs font-bold">سهل</button>
                        <button onclick="startXOBotMode('medium')" class="bg-yellow-600 p-2 rounded-lg text-xs font-bold">متوسط</button>
                        <button onclick="startXOBotMode('hard')" class="bg-red-600 p-2 rounded-lg text-xs font-bold">صعب</button>
                    </div>
                </div>
            </div>

            <div class="border-t border-gray-700 pt-4 space-y-2">
                <h4 class="text-xs text-gray-400 text-right">🔑 أدخل رمز أو كود الغرفة المخصص للعب المشترك:</h4>
                <input type="text" id="customRoomCode" class="w-full p-3 rounded-xl bg-gray-700 text-center font-bold tracking-widest text-white border border-gray-600" placeholder="اكتب الرمز هنا...">
                <button id="lobbyActionBtn" class="w-full font-black p-3 rounded-xl transition text-slate-900"></button>
            </div>
            <button onclick="exitToHub()" class="text-sm text-gray-400 hover:text-white underline block w-full text-center">العودة للرئيسية</button>
        </div>
    </div>

    <div id="xoPlayArea" class="hidden flex-1 flex flex-col p-4 h-full items-center justify-center">
        <div class="flex gap-6 mb-2 bg-gray-800 px-6 py-2 rounded-full border border-gray-700 text-sm">
            <span class="text-blue-400 font-bold" id="xoRoundWidget">الجولة: 1</span>
        </div>
        <h3 id="xoTurnStatus" class="text-lg font-bold mb-4 text-amber-400 bg-gray-800 px-6 py-1.5 rounded-full border border-gray-700">جاري التحميل...</h3>
        <div class="grid grid-cols-3 gap-3 w-80 h-80 bg-gray-800 p-3 rounded-2xl border border-gray-700">
            <button onclick="handleXOCellClick(0)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-0"></button>
            <button onclick="handleXOCellClick(1)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-1"></button>
            <button onclick="handleXOCellClick(2)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-2"></button>
            <button onclick="handleXOCellClick(3)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-3"></button>
            <button onclick="handleXOCellClick(4)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-4"></button>
            <button onclick="handleXOCellClick(5)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-5"></button>
            <button onclick="handleXOCellClick(6)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-6"></button>
            <button onclick="handleXOCellClick(7)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-7"></button>
            <button onclick="handleXOCellClick(8)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full border border-gray-800 text-white" id="cell-8"></button>
        </div>
        <button onclick="exitToHub()" class="mt-4 bg-red-600 hover:bg-red-700 px-6 py-2 rounded-xl font-bold transition">خروج</button>
    </div>

    <div id="snakeCanvasArea" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col">
        <div class="absolute top-4 left-4 z-50 bg-gray-900/90 px-5 py-2 rounded-2xl border border-gray-700 flex items-center gap-6 text-xs font-bold">
            <span class="text-cyan-400">غرفة الدودة والمغناطيس 🧲</span>
            <span class="text-yellow-400" id="snakeLiveScore">عداد نقاطك: 0</span>
            <span class="text-pink-500 hidden" id="magnetStatusWidget">🧲 فعال!</span>
            <button onclick="exitToHub()" class="bg-red-600 text-white px-3 py-1 rounded-xl hover:bg-red-700 transition">خروج</button>
        </div>
        <canvas id="snakeFullScreenCanvas"></canvas>
    </div>

    <script>
        const socket = io();
        let myUsername = "", myColor = "", mySymbol = "", currentRoom = "", currentTurn = "", activeMenu = "";
        let gameMode = "bot";
        let botDifficulty = "easy";
        let localXOBoard = Array(9).fill("");

        const canvas = document.getElementById("snakeFullScreenCanvas");
        const ctx = canvas.getContext("2d");
        let currentCandies = [], currentPlayers = {}, currentBots = {}, currentMagnets = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        function switchScreen(oldId, newId) {
            document.getElementById(oldId).classList.add('hidden');
            document.getElementById(newId).classList.remove('hidden');
        }

        function connectToHub() {
            myUsername = document.getElementById('usernameInput').value.trim();
            myColor = document.getElementById('snakeColorInput').value;
            if(!myUsername) return alert("من فضلك اكتب اسمك المستعار أولاً!");
            socket.emit('joinHub', { username: myUsername, color: myColor });
            switchScreen('loginScreen', 'gameHub');
        }

        function openGameMenu(game) {
            activeMenu = game;
            switchScreen('gameHub', 'lobbyArea');
            document.getElementById('xoMenuOptions').classList.add('hidden');
            const btn = document.getElementById('lobbyActionBtn');

            if(game === 'xo') {
                document.getElementById('lobbyTitle').innerText = "غرفة جولات XO الخاصة";
                document.getElementById('xoMenuOptions').classList.remove('hidden');
                btn.innerText = "دخول برمز الغرفة";
                btn.className = "w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition shadow-lg";
                btn.onclick = startXORoomOnline;
            } else {
                document.getElementById('lobbyTitle').innerText = "غرفة الدودة والمغناطيس والحلويات";
                btn.innerText = "دخول برمز الغرفة أونلاين";
                btn.className = "w-full bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-bold p-3 rounded-xl transition shadow-lg";
                btn.onclick = startSnakeRoomOnline;
            }
        }

        function startXOBotMode(diff) {
            gameMode = "bot";
            botDifficulty = diff;
            localXOBoard.fill("");
            currentTurn = "X";
            switchScreen('lobbyArea', 'xoPlayArea');
            document.getElementById('xoRoundWidget').innerText = "نمط البوت الفردي";
            document.getElementById('xoTurnStatus').innerText = `دورك (X) - بوت مستوى ${diff}`;
            clearXOFrontBoard();
        }

        function handleXOCellClick(idx) {
            if (gameMode === "bot") {
                if (localXOBoard[idx] !== "" || currentTurn !== "X") return;
                localXOBoard[idx] = "X";
                renderXOFrontUI();
                if (checkClientWin(localXOBoard, "X")) return endMatchXO("🎉 انتصرت على البوت!");
                if (!localXOBoard.includes("")) return endMatchXO("تعادل!");
                currentTurn = "O";
                setTimeout(triggerXOBotBrain, 400);
            } else {
                if(currentTurn === mySymbol) socket.emit('makeXOMove', { roomCode: currentRoom, index: idx, symbol: mySymbol });
            }
        }

        function triggerXOBotBrain() {
            let av = localXOBoard.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            let move = av[Math.floor(Math.random() * av.length)];
            if(move !== undefined) {
                localXOBoard[move] = "O";
                renderXOFrontUI();
                if (checkClientWin(localXOBoard, "O")) return endMatchXO("البوت فاز!");
                if (!localXOBoard.includes("")) return endMatchXO("تعادل!");
                currentTurn = "X";
                document.getElementById('xoTurnStatus').innerText = "دورك للعب الآن (X)";
            }
        }

        function checkClientWin(b, s) {
            const w = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            return w.some(p => b[p[0]] === s && b[p[1]] === s && b[p[2]] === s);
        }

        function renderXOFrontUI() {
            localXOBoard.forEach((v, i) => {
                const cell = document.getElementById(`cell-${i}`);
                cell.innerText = v;
                cell.className = `bg-gray-900 text-4xl font-black rounded-xl h-full w-full ${v==='X'?'text-blue-400':'text-red-400'}`;
            });
        }
        function clearXOFrontBoard() { for(let i=0;i<9;i++) document.getElementById(`cell-${i}`).innerText = ""; }
        function endMatchXO(m) { alert(m); exitToHub(); }

        function startXORoomOnline() {
            gameMode = "online";
            currentRoom = document.getElementById('customRoomCode').value.trim();
            if(!currentRoom) return alert("أدخل رمز الغرفة أولاً!");
            socket.emit('joinXOGame', { roomCode: currentRoom, username: myUsername });
            switchScreen('lobbyArea', 'xoPlayArea');
            clearXOFrontBoard();
        }

        socket.on('xoInit', (data) => { mySymbol = data.symbol; });
        socket.on('xoStart', (data) => {
            currentTurn = data.turn;
            document.getElementById('xoRoundWidget').innerText = `الجولة: ${data.round}`;
            document.getElementById('xoTurnStatus').innerText = currentTurn === mySymbol ? "دورك الآن!" : "انتظر الخصم...";
        });
        socket.on('xoUpdate', (data) => {
            currentTurn = data.turn;
            data.board.forEach((v, i) => {
                document.getElementById(`cell-${i}`).innerText = v;
            });
            document.getElementById('xoTurnStatus').innerText = currentTurn === mySymbol ? "دورك الآن!" : "انتظر الخصم...";
        });
        socket.on('xoRoundEnd', (data) => {
            alert(`انتهاء الجولة! الفائز: ${data.winnerSymbol}`);
            document.getElementById('xoRoundWidget').innerText = `الجولة: ${data.round}`;
            clearXOFrontBoard();
        });

        function startSnakeRoomOnline() {
            currentRoom = document.getElementById('customRoomCode').value.trim();
            if(!currentRoom) return alert("أدخل رمز الغرفة الخاصة للدخول!");
            resizeCanvas();
            switchScreen('lobbyArea', 'snakeCanvasArea');
            socket.emit('joinSnakeRoom', { roomCode: currentRoom, username: myUsername, color: myColor });
        }

        window.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp" || e.key === "w") socket.emit('snakeRoomDirection', { roomCode: currentRoom, direction: "UP" });
            if (e.key === "ArrowDown" || e.key === "s") socket.emit('snakeRoomDirection', { roomCode: currentRoom, direction: "DOWN" });
            if (e.key === "ArrowLeft" || e.key === "a") socket.emit('snakeRoomDirection', { roomCode: currentRoom, direction: "LEFT" });
            if (e.key === "ArrowRight" || e.key === "d") socket.emit('snakeRoomDirection', { roomCode: currentRoom, direction: "RIGHT" });
        });

        socket.on('snakeRoomUpdate', (data) => {
            currentCandies = data.candies;
            currentPlayers = data.players;
            currentBots = data.bots;
            currentMagnets = data.magnets || [];

            let mySnake = currentPlayers[socket.id];
            let offsetX = 0, offsetY = 0;
            if (mySnake && mySnake.body[0]) {
                offsetX = canvas.width / 2 - mySnake.body[0].x;
                offsetY = canvas.height / 2 - mySnake.body[0].y;
                document.getElementById('snakeLiveScore').innerText = `عداد نقاطك: ${mySnake.score}`;
                
                // إظهار وإخفاء مؤشر المغناطيس
                if(mySnake.magnetTimer > 0) {
                    document.getElementById('magnetStatusWidget').classList.remove('hidden');
                    document.getElementById('magnetStatusWidget').innerText = `🧲 فعال (${Math.ceil(mySnake.magnetTimer)}ث)`;
                } else {
                    document.getElementById('magnetStatusWidget').classList.add('hidden');
                }
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(offsetX, offsetY); 

            // رسم أرضية الخريطة 1600x1600 مع الحدود الحمراء القاتلة
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, 1600, 1600);
            
            // رسم الحدود القاتلة باللون الأحمر اللامع
            ctx.strokeStyle = "#ef4444";
            ctx.lineWidth = 8;
            ctx.strokeRect(0, 0, 1600, 1600);

            // رسم المغانط العشوائية التلقائية (تظهر كل 10 ثوانٍ)
            currentMagnets.forEach(m => {
                ctx.fillStyle = "#3b82f6";
                ctx.font = "20px Arial";
                ctx.fillText("🧲", m.x, m.y + 15);
            });

            // رسم الحلويات ثلاثية الأبعاد الكثيفة
            currentCandies.forEach(c => {
                ctx.save();
                if (c.type === 'donut') {
                    ctx.fillStyle = "#f43f5e";
                    ctx.beginPath(); ctx.arc(c.x + 10, c.y + 10, 10, 0, 2*Math.PI); ctx.fill();
                    ctx.fillStyle = "#0f172a";
                    ctx.beginPath(); ctx.arc(c.x + 10, c.y + 10, 4, 0, 2*Math.PI); ctx.fill();
                } else {
                    let gradient = ctx.createRadialGradient(c.x+6, c.y+6, 2, c.x+10, c.y+10, 10);
                    gradient.addColorStop(0, '#22c55e');
                    gradient.addColorStop(1, '#15803d');
                    ctx.fillStyle = gradient;
                    ctx.beginPath(); ctx.arc(c.x + 10, c.y + 10, 9, 0, 2 * Math.PI); ctx.fill();
                }
                ctx.restore();
            });

            // رسم الديدان وتعديل شكل اللاعبين والأسماء المستقرة
            let allEntities = { ...currentPlayers, ...currentBots };
            for (let id in allEntities) {
                let ent = allEntities[id];
                ent.body.forEach((seg, index) => {
                    ctx.fillStyle = ent.color;
                    ctx.beginPath();
                    ctx.arc(seg.x + 10, seg.y + 10, index === 0 ? 11 : 9, 0, 2 * Math.PI);
                    ctx.fill();

                    if (index === 0) {
                        ctx.fillStyle = "#ffffff";
                        ctx.font = "bold 12px sans-serif";
                        ctx.fillText(`${ent.username} (${ent.score})`, seg.x - 20, seg.y - 12);
                    }
                });
            }
            ctx.restore();
        });

        function exitToHub() { window.location.reload(); }
    </script>
</body>
</html>
