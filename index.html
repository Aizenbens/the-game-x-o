<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HE IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-gray-900 text-white font-sans">

    <div id="loginScreen" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl border border-gray-700 w-full max-w-sm text-center space-y-4">
            <h2 class="text-2xl font-bold">ENTER YOU NAME</h2>
            <input type="text" id="usernameInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-center text-white" placeholder="اسمك المستعار...">
            <button onclick="connectToOnline()" class="w-full bg-blue-600 hover:bg-blue-700 font-bold p-3 rounded-xl transition">دخول صالة الألعاب</button>
        </div>
    </div>

    <div id="gameHub" class="hidden flex-1 flex flex-col md:flex-row p-4 gap-4 h-full overflow-hidden">
        <div class="flex-1 bg-gray-800 rounded-2xl p-6 border border-gray-700 flex flex-col justify-center items-center gap-6">
            <h1 class="text-3xl font-black text-blue-400">THE IT  🌐</h1>
            <div class="flex flex-wrap gap-4 justify-center">
                <button onclick="goToLobby('xo')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">❌ XO تحدي الغرف أونلاين</button>
                <button onclick="goToLobby('snake')" class="bg-lime-500 hover:bg-lime-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">🐍 لعبة الدودة (فردي)</button>
            </div>
        </div>

        <div class="w-full md:w-80 bg-gray-800 rounded-2xl p-4 border border-gray-700 flex flex-col justify-between h-96 md:h-full">
            <div>
                <h4 class="font-bold border-b border-gray-700 pb-2 mb-2 text-emerald-400">🟢 PLAYERES IS HERE:</h4>
                <div id="onlineUsersContainer" class="space-y-1 max-h-24 overflow-y-auto text-sm text-gray-300"></div>
            </div>
            <div class="flex flex-col flex-1 mt-4 overflow-hidden">
                <h4 class="font-bold text-blue-400 mb-1">💬 JST TALKING:</h4>
                <div id="chatMessagesBox" class="flex-1 bg-gray-950 p-2 rounded-xl overflow-y-auto text-sm space-y-2 mb-2 border border-gray-700"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-2 rounded-lg bg-gray-700 text-white text-sm" placeholder="اكتب شيئاً...">
                    <button onclick="sendChatMessage()" class="bg-blue-600 px-4 rounded-lg text-sm font-bold">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lobbyArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-700 text-center space-y-4">
            <h2 id="lobbyTitle" class="text-2xl font-bold">اللوبي</h2>
            <div id="xoOptions" class="hidden space-y-4">
                <input type="text" id="xoRoomCode" class="w-full p-3 rounded bg-gray-700 text-center tracking-widest font-bold" placeholder="THE CODE">
                <button onclick="joinXORoom()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded-xl transition">START </button>
            </div>
            <div id="snakeOptions" class="hidden">
                <button onclick="startSnakeGame()" class="w-full bg-lime-500 hover:bg-lime-600 text-slate-900 font-bold p-3 rounded-xl transition">PLAY ALONE</button>
            </div>
            <button onclick="exitToHub()" class="text-sm text-gray-400 hover:text-white underline block w-full">العودة للرئيسية</button>
        </div>
    </div>

    <div id="xoPlayArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <h3 id="xoTurnStatus" class="text-xl font-bold mb-4 text-amber-400 bg-gray-800 px-6 py-2 rounded-full">JST WAIT...</h3>
        <div class="grid grid-cols-3 gap-3 w-80 h-80 bg-gray-800 p-3 rounded-2xl border border-gray-700">
            <button onclick="triggerXOMove(0)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-0"></button>
            <button onclick="triggerXOMove(1)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-1"></button>
            <button onclick="triggerXOMove(2)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-2"></button>
            <button onclick="triggerXOMove(3)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-3"></button>
            <button onclick="triggerXOMove(4)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-4"></button>
            <button onclick="triggerXOMove(5)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-5"></button>
            <button onclick="triggerXOMove(6)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-6"></button>
            <button onclick="triggerXOMove(7)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-7"></button>
            <button onclick="triggerXOMove(8)" class="bg-gray-900 text-4xl font-black rounded-xl h-full w-full" id="cell-8"></button>
        </div>
        <button onclick="exitToHub()" class="mt-4 bg-red-600 hover:bg-red-700 px-6 py-2 rounded-xl font-bold transition">انسحاب</button>
    </div>

    <div id="snakeCanvasArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <canvas id="snakeCanvas" width="400" height="400" class="bg-gray-950 border-4 border-gray-800 rounded-2xl"></canvas>
        <button onclick="exitToHub()" class="mt-4 bg-gray-800 px-6 py-2 rounded-xl font-bold">GET OUT</button>
    </div>

    <script>
        const socket = io(); // اتصال فوري تلقائي ديناميكي
        let myName = "";
        let mySymbol = "";
        let currentRoom = "";
        let currentTurn = "";

        function switchScreen(oldId, newId) {
            document.getElementById(oldId).classList.add('hidden');
            document.getElementById(newId).classList.remove('hidden');
        }

        function connectToOnline() {
            myName = document.getElementById('usernameInput').value.trim();
            if(!myName) return alert("اWHO ARE YOU ?!");
            socket.emit('joinHub', myName);
            switchScreen('loginScreen', 'gameHub');
        }

        socket.on('updateOnlineUsers', (users) => {
            document.getElementById('onlineUsersContainer').innerHTML = users.map(u => `<div>🔹 ${u}</div>`).join('');
        });

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if(input.value.trim()) {
                socket.emit('sendGlobalMessage', { name: myName, msg: input.value.trim() });
                input.value = "";
            }
        }

        socket.on('receiveGlobalMessage', (data) => {
            const box = document.getElementById('chatMessagesBox');
            box.innerHTML += `<div><strong class="text-blue-400">${data.name}:</strong> ${data.msg}</div>`;
            box.scrollTop = box.scrollHeight;
        });

        function goToLobby(game) {
            switchScreen('gameHub', 'lobbyArea');
            document.getElementById('xoOptions').classList.add('hidden');
            document.getElementById('snakeOptions').classList.add('hidden');
            if(game === 'xo') {
                document.getElementById('lobbyTitle').innerText = "WITH WHO X-O";
                document.getElementById('xoOptions').classList.remove('hidden');
            } else {
                document.getElementById('lobbyTitle').innerText = "ALONE";
                document.getElementById('snakeOptions').classList.remove('hidden');
            }
        }

        function joinXORoom() {
            currentRoom = document.getElementById('xoRoomCode').value.trim();
            if(!currentRoom) return alert("ENTER CODE!");
            socket.emit('joinXOGame', { roomCode: currentRoom, username: myName });
            switchScreen('lobbyArea', 'xoPlayArea');
        }

        socket.on('xoInit', (data) => { mySymbol = data.symbol; });
        socket.on('xoWaiting', (msg) => { document.getElementById('xoTurnStatus').innerText = msg; });
        
        socket.on('xoStart', (data) => {
            currentTurn = data.turn;
            document.getElementById('xoTurnStatus').innerText = currentTurn === mySymbol ? "YOUR TURN!" : "WAIT...";
        });

        function triggerXOMove(index) {
            if(currentTurn === mySymbol) {
                socket.emit('makeXOMove', { roomCode: currentRoom, index: index, symbol: mySymbol });
            }
        }

        socket.on('xoUpdate', (data) => {
            currentTurn = data.turn;
            // تحديث واجهة المربعات
            data.board.forEach((val, idx) => {
                const cell = document.getElementById(`cell-${idx}`);
                cell.innerText = val;
                if(val === "X") cell.className = "bg-gray-900 text-4xl font-black rounded-xl h-full w-full text-blue-400";
                if(val === "O") cell.className = "bg-gray-900 text-4xl font-black rounded-xl h-full w-full text-red-400";
            });

            document.getElementById('xoTurnStatus').innerText = currentTurn === mySymbol ? "دورك الآن للعب!" : "انتظر حركة الخصم...";
            checkLocalWinner(data.board);
        });

        function checkLocalWinner(board) {
            const wins = [[0,1,2], [3,4,5], [6,7,8], [0,3,6], [1,4,7], [2,5,8], [0,4,8], [2,4,6]];
            wins.forEach(p => {
                if(board[p[0]] && board[p[0]] === board[p[1]] && board[p[0]] === board[p[2]]) {
                    alert(`🎉 THE WINNER IS: ${board[p[0]]}`);
                    exitToHub();
                }
            });
        }

        function exitToHub() {
            window.location.reload(); // أسهل طريقة لتنظيف الذاكرة والخروج من الغرف أونلاين
        }
        
        // (يمكن وضع كود تحريك السنيك هنا كالمعتاد عند الضغط على بدء اللعبة)
    </script>
</body>
</html>
