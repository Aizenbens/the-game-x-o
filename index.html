<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none, viewport-fit=cover">
    <title>منصة الألعاب العالمية أونلاين 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050811; font-family: 'Tajawal', sans-serif; touch-action: none; -webkit-user-select: none; }
        canvas { display: block; width: 100vw; height: 100vh; position: absolute; top:0; left:0; }
        .glass-panel { background: rgba(7, 15, 33, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .neon-glow { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
        * { -webkit-tap-highlight-color: transparent; outline: none; }
    </style>
</head>
<body class="text-white h-full flex flex-col justify-between bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-950 via-blue-950 to-black">

    <div id="loginScreen" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-4 bg-slate-950">
        <div class="glass-panel p-8 sm:p-10 rounded-3xl w-full max-w-sm text-center space-y-6 border border-cyan-500/20">
            <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-indigo-500">🎮 المنصة العالمية</h2>
            <p class="text-gray-400 text-xs">أدخل اسمك المستعار ولونك المفضل لخوض مواجهات الأونلاين الحية</p>
            <input type="text" id="usernameInput" class="w-full p-4 rounded-2xl bg-gray-900/90 border border-gray-700 text-center text-white font-bold placeholder-gray-500 focus:border-cyan-500 transition" placeholder="اكتب اسمك هنا...">
            <div class="text-right bg-gray-900/50 p-4 rounded-2xl border border-gray-800">
                <label class="text-xs text-cyan-400 block mb-2 font-bold">🎨 اختر لون دوتك الخاص:</label>
                <input type="color" id="snakeColorInput" class="w-full h-12 p-1 rounded-xl bg-gray-800 border border-gray-700 cursor-pointer" value="#06b6d4">
            </div>
            <button onclick="connectToHub()" class="w-full bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 font-black p-4 rounded-2xl text-white tracking-wide shadow-lg shadow-cyan-500/20 active:scale-95 transition">دخول السيرفر الرئيسي</button>
        </div>
    </div>

    <div id="gameHub" class="hidden flex-1 flex flex-col lg:flex-row p-4 sm:p-6 gap-6 h-full overflow-hidden">
        <div class="w-full lg:w-80 glass-panel rounded-3xl p-4 flex flex-col h-64 lg:h-full gap-4">
            <div class="border-b border-gray-800 pb-2">
                <h3 class="text-xs font-black text-cyan-400 flex items-center gap-2">🟢 المتصلون الآن:</h3>
                <div id="lobbyOnlineUsersList" class="h-20 lg:h-32 overflow-y-auto space-y-1 mt-2"></div>
            </div>
            <div class="flex-1 flex flex-col min-h-0">
                <h4 class="text-xs font-black text-amber-400 mb-2">💬 المحادثات المباشرة:</h4>
                <div id="hubChatMessagesWrapper" class="flex-1 overflow-y-auto space-y-2 bg-black/30 p-3 rounded-xl border border-gray-900 mb-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="hubChatMsgInput" class="flex-1 bg-gray-900 rounded-xl px-3 py-2 text-xs text-white border border-gray-700 focus:border-cyan-500" placeholder="ارسل رسالة للجميع...">
                    <button onclick="sendHubMessage()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 rounded-xl text-xs transition">إرسال</button>
                </div>
            </div>
        </div>

        <div class="flex-1 glass-panel rounded-3xl p-6 sm:p-8 flex flex-col justify-center items-center gap-6 text-center">
            <h1 class="text-3xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">اختر معركتك أونلاين ⚡</h1>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full max-w-3xl">
                <button onclick="joinMatchmaking('xo')" class="glass-panel border-amber-500/30 p-6 rounded-2xl text-amber-400 font-bold hover:bg-amber-950/20 transition flex flex-col items-center gap-2">
                    <span class="text-4xl">❌⭕</span> <span>تحدي XO أونلاين</span>
                </button>
                <button onclick="joinMatchmaking('chess')" class="glass-panel border-purple-500/30 p-6 rounded-2xl text-purple-400 font-bold hover:bg-purple-950/20 transition flex flex-col items-center gap-2">
                    <span class="text-4xl">👑</span> <span>شطرنج أونلاين 3D</span>
                </button>
                <button onclick="joinMatchmaking('snake')" class="glass-panel border-cyan-500/30 p-6 rounded-2xl text-cyan-400 font-bold hover:bg-cyan-950/20 transition flex flex-col items-center gap-2">
                    <span class="text-4xl">🐍🧲</span> <span>ساحة الدودة أونلاين</span>
                </button>
            </div>
            <div id="matchmakingStatus" class="text-xs text-gray-400 animate-pulse hidden">جاري البحث عن خصم حقيقي...</div>
        </div>
    </div>

    <div id="xoPlayArea" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
        <h3 id="xoTurnStatus" class="text-base font-black mb-6 text-amber-400 bg-gray-900 px-6 py-2 rounded-full">ينتظر اللاعب الآخر...</h3>
        <div class="grid grid-cols-3 gap-3 w-72 h-72 sm:w-80 sm:h-80 bg-gray-900 p-3 rounded-2xl border border-gray-800 shadow-2xl">
            <button onclick="clickXOCell(0)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-0"></button>
            <button onclick="clickXOCell(1)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-1"></button>
            <button onclick="clickXOCell(2)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-2"></button>
            <button onclick="clickXOCell(3)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-3"></button>
            <button onclick="clickXOCell(4)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-4"></button>
            <button onclick="clickXOCell(5)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-5"></button>
            <button onclick="clickXOCell(6)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-6"></button>
            <button onclick="clickXOCell(7)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-7"></button>
            <button onclick="clickXOCell(8)" class="bg-gray-950 text-4xl font-black rounded-xl" id="cell-8"></button>
        </div>
        <button onclick="exitGame('xoPlayArea')" class="mt-6 bg-red-600 hover:bg-red-700 px-8 py-2.5 rounded-xl font-bold text-sm transition">انسحاب وتراجع</button>
    </div>

    <div id="chessPlayArea" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col items-center justify-center p-4">
        <div id="chessStatus" class="mb-4 text-xs font-black bg-purple-950 px-4 py-2 rounded-full border border-purple-500/30">جاري بدء الشطرنج...</div>
        <div class="chess-container-3d">
            <div id="chessBoard" class="board-3d grid grid-cols-8 grid-rows-8 w-72 h-72 sm:w-96 sm:h-96 bg-gray-900 border-4 border-amber-900 rounded-xl overflow-hidden shadow-2xl"></div>
        </div>
        <button onclick="exitGame('chessPlayArea')" class="mt-6 bg-red-600 hover:bg-red-700 px-8 py-2.5 rounded-xl font-bold text-sm transition">انسحاب</button>
    </div>

    <div id="snakeCanvasArea" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col overflow-hidden">
        <div class="absolute top-4 left-4 z-50 glass-panel px-4 py-2 rounded-2xl flex items-center gap-4 text-xs font-black shadow-2xl">
            <span class="text-cyan-400">🐍 أونلاين</span>
            <span class="text-yellow-400" id="snakeLiveScore">نقاطك: 0</span>
            <span class="text-pink-500 hidden animate-pulse font-black" id="magnetStatusWidget">🧲 جذب فعال (<span id="magnetSecondsLeft">6</span>ث)</span>
            <button onclick="exitGame('snakeCanvasArea')" class="bg-red-600 text-white px-3 py-1 rounded-xl text-[10px] active:scale-90 transition">خروج</button>
        </div>

        <div class="absolute top-4 right-4 z-50 glass-panel p-3 rounded-xl w-36 sm:w-48 text-[10px] shadow-2xl max-h-[20vh] flex flex-col">
            <h4 class="font-black text-amber-400 border-b border-gray-800 pb-1 mb-1">🏆 الصدارة الحية:</h4>
            <div id="snakeLiveLeaderboard" class="space-y-0.5 overflow-y-auto flex-1 font-bold"></div>
        </div>

        <canvas id="snakeFullScreenCanvas"></canvas>
    </div>

    <script>
        const socket = io();
        let myUsername = "", myColor = "", currentRoom = "", myGameSymbol = "X";
        const canvas = document.getElementById("snakeFullScreenCanvas");
        const ctx = canvas.getContext("2d");
        const MAP_SIZE = 3000;
        const GRID_SIZE = 22; // زيادة الحجم ليكون المظهر أجمل وأوضح

        // كائن دودة اللاعب المحلي
        let player = { username: "أنت", color: "#06b6d4", body: [], direction: "RIGHT", nextDirection: "RIGHT", score: 0, magnetTimer: 0 };
        let candies = [], bots = [], magnets = [], snakeLoop = null, magnetLoop = null;

        function connectToHub() {
            myUsername = document.getElementById('usernameInput').value.trim();
            myColor = document.getElementById('snakeColorInput').value;
            if(!myUsername) return alert("من فضلك اكتب اسمك أولاً!");
            player.username = myUsername; player.color = myColor;
            socket.emit('joinHub', { username: myUsername, color: myColor });
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('gameHub').classList.remove('hidden');
        }

        function sendHubMessage() {
            const inp = document.getElementById('hubChatMsgInput');
            if(!inp.value.trim()) return;
            socket.emit('sendHubChatMessage', { sender: myUsername, message: inp.value.trim(), color: myColor });
            inp.value = "";
        }

        socket.on('receiveHubChatMessage', (data) => {
            const wrap = document.getElementById('hubChatMessagesWrapper');
            wrap.innerHTML += `<div class="text-right text-xs"><span style="color:${data.color}" class="font-bold">${data.sender}:</span> <span class="text-gray-300">${data.message}</span></div>`;
            wrap.scrollTop = wrap.scrollHeight;
        });

        socket.on('updateOnlineUsers', (users) => {
            document.getElementById('lobbyOnlineUsersList').innerHTML = users.map(u => `<div class="text-xs font-bold truncate" style="color:${u.color}">${u.username}</div>`).join('');
        });

        function joinMatchmaking(game) {
            document.getElementById('matchmakingStatus').classList.remove('hidden');
            socket.emit('joinMatchmaking', { game: game, username: myUsername, color: myColor });
        }

        socket.on('matchFound', (data) => {
            document.getElementById('matchmakingStatus').classList.add('hidden');
            currentRoom = data.room;
            document.getElementById('gameHub').classList.add('hidden');

            if(data.game === 'xo') {
                document.getElementById('xoPlayArea').classList.remove('hidden');
                myGameSymbol = data.symbol;
                document.getElementById('xoTurnStatus').innerText = `تبدأ المباراة! أنت تلعب بـ (${myGameSymbol})`;
            } else if(data.game === 'chess') {
                document.getElementById('chessPlayArea').classList.remove('hidden');
                initOnlineChess();
            } else if(data.game === 'snake') {
                document.getElementById('snakeCanvasArea').classList.remove('hidden');
                startSuperSnakeOnline();
            }
        });

        function exitGame(screenId) {
            socket.emit('leaveRoom', { room: currentRoom });
            if(screenId === 'snakeCanvasArea') { clearInterval(snakeLoop); clearInterval(magnetLoop); }
            document.getElementById(screenId).classList.add('hidden');
            document.getElementById('gameHub').classList.remove('hidden');
        }

        // ================= [ الأنظمة الفائقة لساحة الدودة أونلاين واللمس الذكي ] =================
        function startSuperSnakeOnline() {
            resizeCanvas();
            initSnakeData();
            spawnProBots();
            refillCandiesData();

            if(snakeLoop) clearInterval(snakeLoop);
            snakeLoop = setInterval(runSnakeEngine, 90); // حركة أسرع وأكثر سلاسة

            if(magnetLoop) clearInterval(magnetLoop);
            magnetLoop = setInterval(() => {
                if(magnets.length < 2) {
                    magnets.push({
                        x: Math.floor(Math.random() * (MAP_SIZE / GRID_SIZE)) * GRID_SIZE,
                        y: Math.floor(Math.random() * (MAP_SIZE / GRID_SIZE)) * GRID_SIZE
                    });
                }
            }, 10000); // يظهر المغناطيس كل 10 ثوانٍ عشوائياً
        }

        function initSnakeData() {
            player.body = []; player.direction = "RIGHT"; player.nextDirection = "RIGHT"; player.score = 0; player.magnetTimer = 0;
            let sx = 1500, sy = 1500;
            for(let i=0; i<25; i++) { player.body.push({ x: sx - (i * GRID_SIZE), y: sy }); }
            player.score = player.body.length * 10;
        }

        function spawnProBots() {
            const proNames = ["🤖 المحترف سفاح", "🤖 صائد الديدان", "🤖 إمبراطور النيون", "🤖 الذكاء القاتل"];
            const proColors = ["#f43f5e", "#a855f7", "#10b981", "#f59e0b"];
            bots = [];
            for(let i=0; i<4; i++) {
                let bx = Math.floor(Math.random() * (MAP_SIZE - 500) + 250);
                let by = Math.floor(Math.random() * (MAP_SIZE - 500) + 250);
                let bBody = [];
                for(let l=0; l<60; l++) { bBody.push({ x: bx, y: by + (l * GRID_SIZE) }); } // بوتات عملاقة جداً
                bots.push({ username: proNames[i], color: proColors[i], body: bBody, direction: "UP", score: bBody.length * 10, isDead: false });
            }
        }

        function refillCandiesData() {
            while(candies.length < 600) {
                candies.push({
                    x: Math.floor(Math.random() * (MAP_SIZE / GRID_SIZE)) * GRID_SIZE,
                    y: Math.floor(Math.random() * (MAP_SIZE / GRID_SIZE)) * GRID_SIZE,
                    value: 10, size: 6, pulse: Math.random() * 5
                });
            }
        }

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);

        // [حل مشكلة الهواتف نهائياً] - التقاط السحب واللمس المباشر في أي مكان على الشاشة دون قيود
        let touchX = 0, touchY = 0;
        window.addEventListener("touchstart", (e) => {
            touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
        }, { passive: false });

        window.addEventListener("touchmove", (e) => {
            if (!touchX || !touchY) return;
            let dx = e.touches[0].clientX - touchX;
            let dy = e.touches[0].clientY - touchY;

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 20 && player.direction !== "LEFT") player.nextDirection = "RIGHT";
                else if (dx < -20 && player.direction !== "RIGHT") player.nextDirection = "LEFT";
            } else {
                if (dy > 20 && player.direction !== "UP") player.nextDirection = "DOWN";
                else if (dy < -20 && player.direction !== "DOWN") player.nextDirection = "UP";
            }
            touchX = e.touches[0].clientX; touchY = e.touches[0].clientY;
        }, { passive: false });

        // أزرار كيبورد الكمبيوتر
        window.addEventListener("keydown", (e) => {
            if ((e.key === "ArrowUp" || e.key === "w") && player.direction !== "DOWN") player.nextDirection = "UP";
            if ((e.key === "ArrowDown" || e.key === "s") && player.direction !== "UP") player.nextDirection = "DOWN";
            if ((e.key === "ArrowLeft" || e.key === "a") && player.direction !== "RIGHT") player.nextDirection = "LEFT";
            if ((e.key === "ArrowRight" || e.key === "d") && player.direction !== "LEFT") player.nextDirection = "RIGHT";
        });

        function runSnakeEngine() {
            player.direction = player.nextDirection;
            let head = { ...player.body[0] };
            if (player.direction === "UP") head.y -= GRID_SIZE;
            if (player.direction === "DOWN") head.y += GRID_SIZE;
            if (player.direction === "LEFT") head.x -= GRID_SIZE;
            if (player.direction === "RIGHT") head.x += GRID_SIZE;

            if (head.x < 0 || head.x >= MAP_SIZE || head.y < 0 || head.y >= MAP_SIZE) { initSnakeData(); return; }
            player.body.unshift(head);

            // المغناطيس المؤقت لـ 6 ثواني
            if (player.magnetTimer > 0) {
                player.magnetTimer -= 0.09;
                document.getElementById("magnetStatusWidget").classList.remove("hidden");
                document.getElementById("magnetSecondsLeft").innerText = Math.ceil(player.magnetTimer);
            } else { document.getElementById("magnetStatusWidget").classList.add("hidden"); }

            // التقاط المغناطيس
            for(let i = magnets.length - 1; i >= 0; i--) {
                if (Math.abs(head.x - magnets[i].x) < GRID_SIZE && Math.abs(head.y - magnets[i].y) < GRID_SIZE) {
                    player.magnetTimer = 6; magnets.splice(i, 1);
                }
            }

            let ateCandy = false;
            for(let i = candies.length - 1; i >= 0; i--) {
                let c = candies[i];
                let dist = Math.hypot((head.x + 11) - (c.x + 11), (head.y + 11) - (c.y + 11));
                if (player.magnetTimer > 0 && dist < 200) {
                    c.x += ((head.x - c.x) * 0.3); c.y += ((head.y - c.y) * 0.3); // جذب أسرع وقوي
                }
                if (dist < GRID_SIZE) { player.score += c.value; candies.splice(i, 1); ateCandy = true; }
            }
            if(!ateCandy) player.body.pop();

            // ذكاء البوتات المحترف (تفادي، هجوم، ومحاصرة اللاعب)
            bots.forEach(bot => {
                if (bot.isDead) return;
                let bHead = { ...bot.body[0] };

                // منطق تفادي جسد اللاعب والاصطدام به وملاحقته بذكاء عالي
                let distToPlayer = Math.hypot(bHead.x - head.x, bHead.y - head.y);
                if(distToPlayer < 250) {
                    // إذا كان البوت أطول، يهاجمك ويقوم بحصرك
                    if(bot.score > player.score) {
                        if (head.x > bHead.x && bot.direction !== "LEFT") bot.direction = "RIGHT";
                        else if (head.x < bHead.x && bot.direction !== "RIGHT") bot.direction = "LEFT";
                        else if (head.y > bHead.y && bot.direction !== "UP") bot.direction = "DOWN";
                        else if (head.y < bHead.y && bot.direction !== "DOWN") bot.direction = "UP";
                    } else {
                        // تفادي ذكي جداً لعدم الموت
                        if(bot.direction === "RIGHT") bot.direction = "UP";
                        else if(bot.direction === "LEFT") bot.direction = "DOWN";
                    }
                } else {
                    // البحث التلقائي عن أقرب قطعة حلوى
                    if(candies.length > 0 && Math.random() < 0.3) {
                        let c = candies[0];
                        if (c.x > bHead.x && bot.direction !== "LEFT") bot.direction = "RIGHT";
                        else if (c.x < bHead.x && bot.direction !== "RIGHT") bot.direction = "LEFT";
                        else if (c.y > bHead.y && bot.direction !== "UP") bot.direction = "DOWN";
                        else if (c.y < bHead.y && bot.direction !== "DOWN") bot.direction = "UP";
                    }
                }

                if (bot.direction === "UP") bHead.y -= GRID_SIZE;
                if (bot.direction === "DOWN") bHead.y += GRID_SIZE;
                if (bot.direction === "LEFT") bHead.x -= GRID_SIZE;
                if (bot.direction === "RIGHT") bHead.x += GRID_SIZE;

                if (bHead.x < 0 || bHead.x >= MAP_SIZE || bHead.y < 0 || bHead.y >= MAP_SIZE) {
                    triggerPointsTheft(bot.body); bot.isDead = true; return;
                }

                // التحقق من اصطدام رأس البوت بجسدك (تمت هزيمته وسرقة نقاطه)
                player.body.forEach(seg => {
                    if (Math.abs(bHead.x - seg.x) < GRID_SIZE && Math.abs(bHead.y - seg.y) < GRID_SIZE) {
                        triggerPointsTheft(bot.body); bot.isDead = true;
                    }
                });

                if (bot.isDead) return;
                bot.body.unshift(bHead);
                bot.body.pop();
            });

            bots = bots.filter(b => !b.isDead);
            if(bots.length < 4) spawnProBots();
            refillCandiesData();
            drawSuperSnakeGraphics();
        }

        function triggerPointsTheft(body) {
            body.forEach((seg, idx) => {
                if(idx % 2 === 0) candies.push({ x: seg.x, y: seg.y, value: 50, size: 14 }); // حلويات نيون ضخمة جداً مسروقة
            });
        }

        function drawSuperSnakeGraphics() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let cx = canvas.width / 2 - player.body[0].x;
            let cy = canvas.height / 2 - player.body[0].y;
            ctx.save(); ctx.translate(cx, cy);

            // الأرضية الفخمة المتدرجة والنيونية
            ctx.fillStyle = "#060913"; ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

            // رسم الحلويات المضيئة مع وميض أنيق (Pulse)
            candies.forEach(c => {
                c.pulse += 0.1;
                let sizeEffect = c.size + Math.sin(c.pulse) * 1.5;
                ctx.fillStyle = c.size > 10 ? "#22c55e" : "#ff0055";
                ctx.beginPath(); ctx.arc(c.x+11, c.y+11, sizeEffect > 2 ? sizeEffect : 3, 0, 2*Math.PI); ctx.fill();
            });

            magnets.forEach(m => { ctx.font = "24px Arial"; ctx.fillText("🧲", m.x, m.y + 20); });

            // رسم البوتات المحترفة بجسد متناسق ثلاثي الأبعاد
            bots.forEach(bot => {
                bot.body.forEach((seg, idx) => {
                    ctx.fillStyle = bot.color; ctx.beginPath(); ctx.arc(seg.x+11, seg.y+11, idx===0?14:10, 0, 2*Math.PI); ctx.fill();
                });
            });

            // رسم جسد اللاعب بانسيابية تامة وهالة الجذب
            player.body.forEach((seg, idx) => {
                ctx.fillStyle = player.color; ctx.beginPath(); ctx.arc(seg.x+11, seg.y+11, idx===0?15:11, 0, 2*Math.PI); ctx.fill();
                if(player.magnetTimer > 0 && idx === 0) {
                    ctx.strokeStyle = "#ff007f"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(seg.x+11, seg.y+11, 28, 0, 2*Math.PI); ctx.stroke();
                }
            });

            ctx.restore();
            document.getElementById("snakeLiveScore").innerText = `نقاطك: ${player.score}`;

            let leaders = [{name: player.username, score: player.score}];
            bots.forEach(b => leaders.push({name: b.username, score: b.score}));
            leaders.sort((a,b) => b.score - a.score);
            document.getElementById("snakeLiveLeaderboard").innerHTML = leaders.map((l, i) => `<div class="truncate text-[10px]">${i+1}. ${l.name}: ${l.score}</div>`).join('');
        }
    </script>
</body>
</html>
