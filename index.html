<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE IT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-gray-900 text-white font-sans">

    <div id="authScreen" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-3xl font-bold text-center mb-6 flex items-center justify-center gap-2">
                THE IT
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">اسم المستخدم</label>
                    <input type="text" id="usernameInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-blue-500" placeholder="اكتب اسمك هنا...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
                </div>
                
                <div class="flex gap-4 pt-2">
                    <button onclick="handleAuth('register')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded transition shadow-lg">
                        إنشاء حساب
                    </button>
                    <button onclick="handleAuth('login')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded transition shadow-lg">
                        تسجيل الدخول
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameHub" class="hidden flex-1 flex flex-col md:flex-row p-4 gap-4 h-full overflow-hidden">
        <div class="flex-1 bg-gray-800 rounded-lg p-6 border border-gray-700 flex flex-col justify-center items-center gap-6">
            <h3 class="text-2xl font-bold">اختر لعبة للبدء:</h3>
            <div class="flex flex-wrap gap-4 justify-center">
                <button onclick="goToLobby('xo')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">
                    ❌ XO تحدي (أونلاين / ضد البوت)
                </button>
                <button onclick="goToLobby('snake')" class="bg-lime-500 hover:bg-lime-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">
                    🐍 لعبة الدودة أونلاين
                </button>
            </div>
        </div>

        <div class="w-full md:w-80 bg-gray-800 rounded-lg p-4 border border-gray-700 flex flex-col justify-between h-96 md:h-full">
            <div>
                <h4 class="font-bold border-b border-gray-700 pb-2 mb-2 text-emerald-400">🟢 المتصلون الآن:</h4>
                <div id="onlineUsersContainer" class="space-y-1 max-h-32 overflow-y-auto text-sm text-gray-300"></div>
            </div>
            
            <div class="flex flex-col flex-1 mt-4 overflow-hidden">
                <h4 class="font-bold text-blue-400 mb-1">💬 المحادثة العامة:</h4>
                <div id="chatMessagesBox" class="flex-1 bg-gray-900 p-2 rounded overflow-y-auto text-sm space-y-2 mb-2 border border-gray-700"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-2 rounded bg-gray-700 text-white text-sm focus:outline-none" placeholder="اكتب رسالة...">
                    <button onclick="sendChatMessage()" class="bg-blue-600 px-4 rounded text-sm font-bold">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lobbyArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700 text-center">
            <h2 id="lobbyTitle" class="text-2xl font-bold mb-6">لوبي اللعبة</h2>
            
            <div id="xoOptions" class="hidden space-y-4">
                <div class="border-b border-gray-700 pb-3 mb-3">
                    <p class="text-gray-400 mb-2">🤖 اللعب الفردي:</p>
                    <button onclick="startXOAgainstBot()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-3 rounded transition mb-2">
                        تحدي البوت (الذكاء الاصطناعي)
                    </button>
                </div>
                
                <div>
                    <p class="text-gray-400 mb-2">🌐 تحدي أونلاين:</p>
                    <input type="text" id="xoRoomCode" class="w-full p-3 rounded bg-gray-700 text-center text-white font-bold tracking-widest mb-2" placeholder="كود الغرفة">
                    <button onclick="joinXORoom()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded transition">
                        دخول غرفة أونلاين
                    </button>
                </div>
            </div>

            <div id="snakeOnlineOptions" class="hidden space-y-4">
                <p class="text-gray-400">مستعد لتحدي الدودة الكلاسيكية أونلاين؟</p>
                <button onclick="startSnakeGame()" class="w-full bg-lime-500 hover:bg-lime-600 text-slate-900 font-bold p-3 rounded transition">
                    بدء اللعب الآن
                </button>
            </div>

            <button onclick="exitToHub()" class="mt-6 text-sm text-gray-400 hover:text-white underline block w-full text-center">
                العودة للقائمة الرئيسية
            </button>
        </div>
    </div>

    <div id="xoPlayArea" class="hidden flex-1 flex flex-col items-center justify-center p-4 relative">
        <h3 id="xoTurnStatus" class="text-xl font-bold mb-4 text-amber-400">دورك للعب الآن</h3>
        
        <div id="xoGridContainer" class="grid grid-cols-3 gap-2 w-72 h-72 bg-gray-700 p-2 rounded-lg shadow-xl">
            <button onclick="makeXOMove(0)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-0"></button>
            <button onclick="makeXOMove(1)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-1"></button>
            <button onclick="makeXOMove(2)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-2"></button>
            <button onclick="makeXOMove(3)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-3"></button>
            <button onclick="makeXOMove(4)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-4"></button>
            <button onclick="makeXOMove(5)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-5"></button>
            <button onclick="makeXOMove(6)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-6"></button>
            <button onclick="makeXOMove(7)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-7"></button>
            <button onclick="makeXOMove(8)" class="xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full" id="cell-8"></button>
        </div>

        <button onclick="exitToHub()" class="mt-6 bg-red-600 hover:bg-red-700 px-6 py-2 rounded font-bold transition">
            انسحاب والعودة
        </button>
    </div>

    <div id="snakeCanvasArea" class="hidden flex-1 flex flex-col items-center justify-center p-4 relative">
        <canvas id="snakeCanvas" width="400" height="400" class="bg-black border-4 border-lime-500 rounded-lg shadow-2xl"></canvas>
        <button onclick="exitToHub()" class="mt-4 bg-red-600 hover:bg-red-700 px-6 py-2 rounded font-bold transition">
            إنهاء اللعبة والعودة
        </button>
    </div>

    <script>
        // 📡 السطر التلقائي الديناميكي لمنع مشاكل الـ CORS تماماً
        const socket = io(); 
        let myUsername = "";
        let currentGame = "";
        let xoBoard = Array(9).fill("");
        let isBotMode = false;
        let isMyTurn = true;

        // التنقل بين الشاشات
        function switchScreen(oldId, newId) {
            document.getElementById(oldId).classList.add('hidden');
            document.getElementById(newId).classList.remove('hidden');
        }

        // معالجة إنشاء الحساب وتسجيل الدخول
        function handleAuth(authType) {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }
            // إرسال البيانات فوراً عبر الـ Socket
            socket.emit('authRequest', { type: authType, username: user, password: pass });
        }

        // استقبال رد السيرفر
        socket.on('authResponse', (data) => {
            if (data.success) {
                myUsername = data.username;
                switchScreen('authScreen', 'gameHub');
            } else {
                alert(data.message);
            }
        });

        // تحديث المتصلين
        socket.on('updateOnlineUsers', (usersList) => {
            const container = document.getElementById('onlineUsersContainer');
            if(container) {
                container.innerHTML = usersList.map(u => `<div class="flex items-center gap-2">🔹 ${u}</div>`).join('');
            }
        });

        // إدارة غرف الانتظار واللوبي
        function goToLobby(game) {
            currentGame = game;
            switchScreen('gameHub', 'lobbyArea');
            document.getElementById('snakeOnlineOptions').classList.add('hidden');
            document.getElementById('xoOptions').classList.add('hidden');

            if (game === 'snake') {
                document.getElementById('lobbyTitle').innerText = "🐍 لوبي لعبة الدودة";
                document.getElementById('snakeOnlineOptions').classList.remove('hidden');
            } else {
                document.getElementById('lobbyTitle').innerText = "❌ XO لوبي تحدي الأبطال";
                document.getElementById('xoOptions').classList.remove('hidden');
            }
        }

        function exitToHub() {
            switchScreen('lobbyArea', 'gameHub');
            switchScreen('xoPlayArea', 'gameHub');
            switchScreen('snakeCanvasArea', 'gameHub');
            currentGame = "";
            isBotMode = false;
            resetXOBoard();
        }

        // الشات العام الفوري
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(msg) {
                socket.emit('sendGlobalCommunityMessage', { name: myUsername, msg: msg });
                input.value = "";
            }
        }

        socket.on('receiveGlobalCommunityMessage', (data) => {
            const box = document.getElementById('chatMessagesBox');
            if(box) {
                box.innerHTML += `<div><strong class="text-blue-400">${data.name}:</strong> <span class="text-gray-100">${data.msg}</span></div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        // ================= [ منطق ميزة البوتات والذكاء الاصطناعي لـ XO ] =================
        function startXOAgainstBot() {
            isBotMode = true;
            resetXOBoard();
            switchScreen('lobbyArea', 'xoPlayArea');
            document.getElementById('xoTurnStatus').innerText = "لقد بدأت اللعبة ضد البوت الذكي! دورك (X)";
            isMyTurn = true;
        }

        function joinXORoom() {
            const roomCode = document.getElementById('xoRoomCode').value.trim();
            if(!roomCode) { alert("أدخل كود الغرفة أولاً!"); return; }
            isBotMode = false;
            socket.emit('joinXOGame', { roomCode: roomCode, username: myUsername });
            switchScreen('lobbyArea', 'xoPlayArea');
            document.getElementById('xoTurnStatus').innerText = "في انتظار الخصم أونلاين...";
        }

        function makeXOMove(index) {
            if (!isMyTurn || xoBoard[index] !== "") return;

            xoBoard[index] = "X";
            document.getElementById(`cell-${index}`).innerText = "X";
            document.getElementById(`cell-${index}`).classList.add("text-blue-400");

            if (checkXOWinner()) {
                alert("🎉 مبروك! لقد فزت بالتحدي!");
                exitToHub();
                return;
            }

            if (!xoBoard.includes("")) {
                alert("🤝 تعادل رائع!");
                exitToHub();
                return;
            }

            if (isBotMode) {
                isMyTurn = false;
                document.getElementById('xoTurnStatus').innerText = "🤖 البوت يفكر ويخطط للرد...";
                setTimeout(makeBotMove, 700);
            }
        }

        function makeBotMove() {
            let availableCells = [];
            for (let i = 0; i < xoBoard.length; i++) {
                if (xoBoard[i] === "") availableCells.push(i);
            }

            if (availableCells.length > 0) {
                let randomCell = availableCells[Math.floor(Math.random() * availableCells.length)];
                xoBoard[randomCell] = "O";
                document.getElementById(`cell-${randomCell}`).innerText = "O";
                document.getElementById(`cell-${randomCell}`).classList.add("text-red-400");

                if (checkXOWinner()) {
                    alert("😢 البوت فاز هذه المرة! حاول مجدداً.");
                    exitToHub();
                    return;
                }
            }
            isMyTurn = true;
            document.getElementById('xoTurnStatus').innerText = "دورك الآن للعب (X)";
        }

        function checkXOWinner() {
            const winPatterns = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            return winPatterns.some(pattern => {
                const [a, b, c] = pattern;
                return xoBoard[a] && xoBoard[a] === xoBoard[b] && xoBoard[a] === xoBoard[c];
            });
        }

        function resetXOBoard() {
            xoBoard = Array(9).fill("");
            for (let i = 0; i < 9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                if(cell) {
                    cell.innerText = "";
                    cell.className = "xo-cell bg-gray-800 text-4xl font-bold hover:bg-gray-700 rounded transition flex items-center justify-center h-full w-full";
                }
            }
        }

        // ================= [ ميزة تشغيل لعبة الدودة Snake ] =================
        function startSnakeGame() {
            switchScreen('lobbyArea', 'snakeCanvasArea');
        }
    </script>
</body>
</html>
