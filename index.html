<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The X O</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: rgba(30, 41, 59, 0.7);
            --text-color: #f8fafc;
            --x-color: #3b82f6;
            --o-color: #ef4444;
            --accent-color: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .lobby-container { background: var(--container-bg); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 450px; }
        .lobby-container h2 { margin-bottom: 20px; color: var(--accent-color); }
        .btn { background: var(--accent-color); border: none; padding: 12px 20px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px; font-size: 1rem; transition: all 0.3s; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .btn.secondary { background: var(--x-color); }
        .btn.ai { background: #8b5cf6; }
        .input-field { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: white; text-align: center; margin-bottom: 15px; outline: none; font-size: 1.1rem; }
        
        .divider { margin: 15px 0; color: #64748b; font-size: 0.9rem; position: relative; }
        .select-style { width: 100%; padding: 12px; border-radius: 8px; background: #1e293b; color: white; border: 1px solid rgba(255,255,255,0.2); margin-bottom: 15px; outline: none; cursor: pointer; }

        /* واجهة اللعبة الرئيسية */
        .game-container { display: none; background: var(--container-bg); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); gap: 30px; max-width: 900px; width: 100%; border: 1px solid rgba(255,255,255,0.1); }
        .main-game { flex: 1; display: flex; flex-direction: column; align-items: center; }
        
        .header-info { text-align: center; margin-bottom: 20px; width: 100%; }
        .round-counter { font-size: 1.5rem; font-weight: bold; color: var(--accent-color); margin-bottom: 5px; }
        
        /* عداد النقاط */
        .score-board { display: flex; justify-content: center; gap: 20px; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; background: rgba(0,0,0,0.2); padding: 8px 20px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .score-x { color: var(--x-color); }
        .score-o { color: var(--o-color); }

        .turn-indicator { font-size: 1.1rem; background: rgba(255,255,255,0.05); padding: 8px 20px; border-radius: 50px; display: inline-block; margin-bottom: 10px; }
        .room-display { font-size: 0.9rem; color: #94a3b8; cursor: pointer; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 5px; display: inline-block; }

        .board { display: grid; grid-template-columns: repeat(3, 100px); grid-template-rows: repeat(3, 100px); gap: 10px; margin-top: 20px; }
        .cell { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.1); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2.5rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; }
        .cell:hover { background: rgba(255,255,255,0.1); transform: scale(1.05); }
        .cell.X { color: var(--x-color); text-shadow: 0 0 10px var(--x-color); }
        .cell.O { color: var(--o-color); text-shadow: 0 0 10px var(--o-color); }

        /* الشات */
        .chat-container { width: 300px; background: rgba(0, 0, 0, 0.2); border-radius: 15px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); overflow: hidden; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; height: 300px; }
        .message { padding: 8px 12px; border-radius: 10px; max-width: 80%; font-size: 0.9rem; word-break: break-word; }
        .message.system { background: rgba(255,255,255,0.1); align-self: center; text-align: center; color: #94a3b8; font-size: 0.8rem; }
        .message.me { background: var(--x-color); align-self: flex-start; }
        .message.other { background: rgba(255,255,255,0.15); align-self: flex-end; }
        .chat-input-area { display: flex; padding: 10px; background: rgba(0,0,0,0.3); }
        .chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 8px 12px; border-radius: 8px; color: white; outline: none; }
        .chat-btn { background: var(--accent-color); border: none; padding: 8px 15px; margin-right: 5px; border-radius: 8px; color: white; cursor: pointer; font-weight: bold; }

        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            .chat-container { width: 100%; }
        }
    </style>
</head>
<body>

<div class="lobby-container" id="lobby">
    <h2>The X O</h2>
    <input type="text" class="input-field" id="playerNameInput" placeholder="أدخل اسم اللاعب">
    
    <div class="divider">🕹️ نمط اللعب الفردي (ضد الذكاء الاصطناعي)</div>
    <select class="select-style" id="difficultySelect">
        <option value="easy">مستوى: سهل (ضعيف)</option>
        <option value="medium">مستوى: عادي (متوسط)</option>
        <option value="hard">مستوى: صعب (قوي جداً)</option>
    </select>
    <button class="btn ai" id="playAiBtn">ابدأ لعب فردي</button>

    <div class="divider">🌐 نمط أونلاين (مع صديق)</div>
    <button class="btn" id="createRoomBtn">إنشاء جولة خاصة</button>
    <input type="text" class="input-field" id="roomCodeInput" placeholder="رمز الجولة للاستلام">
    <button class="btn secondary" id="joinRoomBtn">انضمام للجولة</button>
</div>

<div class="game-container" id="gameArea">
    <div class="main-game">
        <div class="header-info">
            <div class="round-counter" id="roundDisplay">الجولة: 1</div>
            
            <div class="score-board">
                <div class="score-x" id="scoreXDisplay">X (أنت): 0</div>
                <div style="color: #64748b;">|</div>
                <div class="score-o" id="scoreODisplay">O (الخصم): 0</div>
            </div>

            <div class="turn-indicator" id="statusDisplay">جاري التجهيز...</div>
            <br>
            <div class="room-display" id="copyRoomCode" style="display:none;">رمز الغرفة: <span id="roomCodeText"></span> (نسخ)</div>
        </div>
        
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div class="chat-container" id="chatSection">
        <div class="chat-messages" id="chatMessages">
            <div class="message system">شات الجولة</div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="اكتب رسالة..." disabled>
            <button class="chat-btn" id="sendBtn" disabled>إرسال</button>
        </div>
    </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
    const socket = io({ transports: ['websocket', 'polling'] });
    
    const lobby = document.getElementById('lobby');
    const gameArea = document.getElementById('gameArea');
    const cells = document.querySelectorAll('.cell');
    const statusDisplay = document.getElementById('statusDisplay');
    const roundDisplay = document.getElementById('roundDisplay');
    const scoreXDisplay = document.getElementById('scoreXDisplay');
    const scoreODisplay = document.getElementById('scoreODisplay');
    const roomCodeText = document.getElementById('roomCodeText');
    const copyRoomCode = document.getElementById('copyRoomCode');
    const chatSection = document.getElementById('chatSection');
    
    const playerNameInput = document.getElementById('playerNameInput');
    const difficultySelect = document.getElementById('difficultySelect');
    const playAiBtn = document.getElementById('playAiBtn');
    const createRoomBtn = document.getElementById('createRoomBtn');
    const joinRoomBtn = document.getElementById('joinRoomBtn');
    const roomCodeInput = document.getElementById('roomCodeInput');

    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    let mySign = 'X'; 
    let isMyTurn = false;
    let currentRoomCode = "";
    let gameMode = "online"; 
    let pName = "لاعب";

    let scoreX = 0;
    let scoreO = 0;

    let aiBoard = Array(9).fill(null);
    let aiRound = 1;
    let aiCurrentTurn = 'X';
    let aiStartingPlayer = 'X';
    let aiDrawStreak = 0;

    function getPlayerName() {
        return playerNameInput.value.trim() || "لاعب";
    }

    function updateScoreUI() {
        if (gameMode === "single") {
            scoreXDisplay.innerText = `${pName} (X): ${scoreX}`;
            scoreODisplay.innerText = `الكمبيوتر (O): ${scoreO}`;
        } else {
            scoreXDisplay.innerText = `لاعب 1 (X): ${scoreX}`;
            scoreODisplay.innerText = `لاعب 2 (O): ${scoreO}`;
        }
    }

    createRoomBtn.addEventListener('click', () => {
        pName = getPlayerName();
        socket.emit('createPrivateRoom', { name: pName });
    });

    joinRoomBtn.addEventListener('click', () => {
        const code = roomCodeInput.value.trim().toUpperCase();
        pName = getPlayerName();
        if (code !== "") socket.emit('joinPrivateRoom', { roomCode: code, name: pName });
    });

    copyRoomCode.addEventListener('click', () => {
        navigator.clipboard.writeText(currentRoomCode);
        alert('تم نسخ الرمز! أرسله لصديقك.');
    });

    socket.on('roomCreated', (roomCode) => {
        currentRoomCode = roomCode;
        roomCodeText.innerText = roomCode;
        copyRoomCode.style.display = 'inline-block';
        lobby.style.display = 'none';
        gameArea.style.display = 'flex';
        gameMode = "online";
        updateScoreUI();
    });

    socket.on('playerAssignment', (data) => {
        mySign = data.sign;
        statusDisplay.innerText = `أنت: ${pName} (${mySign}). بانتظار الخصم...`;
    });

    socket.on('startRound', (data) => {
        roundDisplay.innerText = `الجولة: ${data.round}`;
        isMyTurn = (data.currentTurn === mySign);
        statusDisplay.innerText = isMyTurn ? "دورك الآن!" : `دور الخصم (${data.currentTurn})`;
        chatInput.disabled = false; sendBtn.disabled = false;
        
        if(data.scores) {
            scoreX = data.scores.X;
            scoreO = data.scores.O;
            updateScoreUI();
        }
        resetLocalBoard();
    });

    socket.on('updateBoard', (data) => {
        const cell = cells[data.index];
        cell.innerText = data.sign; cell.classList.add(data.sign);
        isMyTurn = (data.nextTurn === mySign);
        statusDisplay.innerText = isMyTurn ? "دورك الآن!" : `دور الخصم (${data.nextTurn})`;
    });

    playAiBtn.addEventListener('click', () => {
        pName = getPlayerName();
        gameMode = "single";
        scoreX = 0; scoreO = 0;
        lobby.style.display = 'none';
        gameArea.style.display = 'flex';
        chatSection.style.display = 'none'; 
        copyRoomCode.style.display = 'none';
        updateScoreUI();
        startAiRound();
    });

    function startAiRound() {
        aiBoard = Array(9).fill(null);
        aiCurrentTurn = aiStartingPlayer;
        roundDisplay.innerText = `الجولة: ${aiRound}`;
        resetLocalBoard();
        
        mySign = 'X'; 
        isMyTurn = (aiCurrentTurn === 'X');
        statusDisplay.innerText = isMyTurn ? "دورك الآن!" : "دور الكمبيوتر...";

        if (!isMyTurn) {
            setTimeout(makeAiMove, 500);
        }
    }

    function makeAiMove() {
        const diff = difficultySelect.value;
        let move;
        if (diff === 'easy') move = getRandomMove();
        else if (diff === 'medium') move = Math.random() > 0.5 ? getBestMove() : getRandomMove();
        else move = getBestMove();

        if (move !== null) {
            aiBoard[move] = 'O';
            cells[move].innerText = 'O';
            cells[move].classList.add('O');
            
            const roundResult = checkLocalWinner(aiBoard);
            if (roundResult) {
                setTimeout(() => { handleAiEnd(roundResult); }, 300);
            } else {
                aiCurrentTurn = 'X';
                isMyTurn = true;
                statusDisplay.innerText = "دورك الآن!";
            }
        }
    }

    function getRandomMove() {
        let avail = aiBoard.map((v, i) => v === null ? i : null).filter(v => v !== null);
        return avail.length > 0 ? avail[Math.floor(Math.random() * avail.length)] : null;
    }

    function getBestMove() {
        let bestScore = -Infinity;
        let move = null;
        for (let i = 0; i < 9; i++) {
            if (aiBoard[i] === null) {
                aiBoard[i] = 'O';
                let score = minimax(aiBoard, 0, false);
                aiBoard[i] = null;
                if (score > bestScore) {
                    bestScore = score;
                    move = i;
                }
            }
        }
        return move !== null ? move : getRandomMove();
    }

    function minimax(board, depth, isMaximizing) {
        let result = checkLocalWinner(board);
        if (result === 'O') return 10 - depth;
        if (result === 'X') return depth - 10;
        if (result === 'draw') return 0;

        if (isMaximizing) {
            let bestScore = -Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    board[i] = 'O';
                    let score = minimax(board, depth + 1, false);
                    board[i] = null;
                    bestScore = Math.max(score, bestScore);
                }
            }
            return bestScore;
        } else {
            let bestScore = Infinity;
            for (let i = 0; i < 9; i++) {
                if (board[i] === null) {
                    board[i] = 'X';
                    let score = minimax(board, depth + 1, true);
                    board[i] = null;
                    bestScore = Math.min(score, bestScore);
                }
            }
            return bestScore;
        }
    }

    function checkLocalWinner(b) {
        const cond = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        for (let c of cond) {
            if (b[c[0]] && b[c[0]] === b[c[1]] && b[c[0]] === b[c[2]]) return b[c[0]];
        }
        if (!b.includes(null)) return 'draw';
        return null;
    }

    function handleAiEnd(result) {
        if (result === 'draw') {
            aiDrawStreak++;
            aiStartingPlayer = (aiDrawStreak % 2 !== 0) ? 'O' : 'X';
            alert(`تعادل! الجولة القادمة يبدأها: ${aiStartingPlayer}`);
        } else {
            aiStartingPlayer = result;
            aiDrawStreak = 0;
            if (result === 'X') {
                scoreX++;
                alert(`مبروك! الفائز هو: ${pName}`);
            } else {
                scoreO++;
                alert("للأسف! فاز الكمبيوتر.");
            }
            updateScoreUI();
        }
        aiRound++;
        startAiRound();
    }

    cells.forEach(cell => {
        cell.addEventListener('click', () => {
            const index = cell.getAttribute('data-index');
            if (gameMode === "online" && isMyTurn && cell.innerText === '') {
                socket.emit('makeMove', { index: index, roomCode: currentRoomCode });
            } 
            else if (gameMode === "single" && isMyTurn && cell.innerText === '') {
                aiBoard[index] = 'X';
                cell.innerText = 'X';
                cell.classList.add('X');
                isMyTurn = false;
                
                const roundResult = checkLocalWinner(aiBoard);
                if (roundResult) {
                    setTimeout(() => { handleAiEnd(roundResult); }, 300);
                } else {
                    aiCurrentTurn = 'O';
                    statusDisplay.innerText = "دور الكمبيوتر...";
                    setTimeout(makeAiMove, 600);
                }
            }
        });
    });

    function resetLocalBoard() {
        cells.forEach(c => { c.innerText = ''; c.className = 'cell'; });
    }

    socket.on('receiveMessage', (data) => {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', data.sender === socket.id ? 'me' : 'other');
        msgDiv.innerText = `${data.name}: ${data.text}`;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('systemMessage', (text) => {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', 'system');
        msgDiv.innerText = text;
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    });

    socket.on('errorEvent', (msg) => alert(msg));

    function sendMessage() {
        const text = chatInput.value.trim();
        if (text !== '') {
            socket.emit('sendMessage', { roomCode: currentRoomCode, text: text, name: pName });
            chatInput.value = '';
        }
    }
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
