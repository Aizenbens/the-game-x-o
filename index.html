<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden bg-gray-900 text-white font-sans">

    <div id="authScreen" class="flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700">
            <h2 class="text-3xl font-bold text-center mb-6 flex items-center justify-center gap-2">
                THE
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-4xl mb-1">اسم المستخدم</label>
                    <input type="text" id="usernameInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-blue-500" placeholder="اكتب اسمك هنا...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-4xl mb-1">كلمة المرور</label>
                    <input type="password" id="passwordInput" class="w-full p-3 rounded bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-blue-500" placeholder="••••••••">
                </div>
                
                <div class="flex gap-4 pt-2">
                    <button onclick="handleAuth('register')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold p-3 rounded transition shadow-lg">
                        إنشاء حساب
                    </button>
                    <button onclick="handleAuth('login')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 rounded transition shadow-lg">
                        تسجيل الدخول
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="gameHub" class="hidden flex-1 flex flex-col md:flex-row p-4 gap-4 h-full overflow-hidden">
        <div class="flex-1 bg-gray-800 rounded-lg p-6 border border-gray-700 flex flex-col justify-center items-center gap-6">
            <h3 class="text-2xl font-bold">اختر لعبة للبدء:</h3>
            <div class="flex flex-wrap gap-4 justify-center">
                <button onclick="goToLobby('xo')" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">
                    ❌ XO تحدي
                </button>
                <button onclick="goToLobby('snake')" class="bg-lime-500 hover:bg-lime-600 text-slate-900 text-xl font-bold px-8 py-4 rounded-xl transition shadow-md">
                    🐍 لعبة الدودة أونلاين
                </button>
            </div>
        </div>

        <div class="w-full md:w-80 bg-gray-800 rounded-lg p-4 border border-gray-700 flex flex-col justify-between h-96 md:h-full">
            <div>
                <h4 class="font-bold border-b border-gray-750 pb-2 mb-2 text-emerald-400">🟢 المتصلون الآن:</h4>
                <div id="onlineUsersContainer" class="space-y-1 max-h-32 overflow-y-auto text-sm text-gray-300"></div>
            </div>
            
            <div class="flex flex-col flex-1 mt-4 overflow-hidden">
                <h4 class="font-bold text-blue-400 mb-1">💬 المحادثة العامة:</h4>
                <div id="chatMessagesBox" class="flex-1 bg-gray-900 p-2 rounded overflow-y-auto text-sm space-y-2 mb-2 border border-gray-700"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-2 rounded bg-gray-700 text-white text-sm focus:outline-none" placeholder="اكتب رسالة...">
                    <button onclick="sendChatMessage()" class="bg-blue-600 px-4 rounded text-sm font-bold">إرسال</button>
                </div>
            </div>
        </div>
    </div>

    <div id="lobbyArea" class="hidden flex-1 flex flex-col items-center justify-center p-4">
        <div class="bg-gray-800 p-8 rounded-lg shadow-2xl w-full max-w-md border border-gray-700 text-center">
            <h2 id="lobbyTitle" class="text-2xl font-bold mb-6">لtrace الألعاب</h2>
            
            <div id="xoOptions" class="hidden space-y-4">
                <input type="text" id="xoRoomCode" class="w-full p-3 rounded bg-gray-700 text-center text-white font-bold tracking-widest" placeholder="كود الغرفة">
                <button onclick="joinXORoom()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold p-3 rounded transition">
                    دخول الغرفة واللعب
                </button>
            </div>

            <div id="snakeOnlineOptions" class="hidden space-y-4">
                <p class="text-gray-400">مستعد لتحدي الدودة أونلاين؟</p>
                <button onclick="startSnakeGame()" class="w-full bg-lime-500 hover:bg-lime-600 text-slate-900 font-bold p-3 rounded transition">
                    بدء اللعب الآن
                </button>
            </div>

            <button onclick="exitToHub()" class="mt-6 text-sm text-gray-400 hover:text-white underline">
                العودة للقائمة الرئيسية
            </button>
        </div>
    </div>

    <div id="snakeCanvasArea" class="hidden flex-1 flex flex-col items-center justify-center p-4 relative">
        <canvas id="snakeCanvas" width="400" height="400" class="bg-black border-4 border-lime-500 rounded-lg shadow-2xl"></canvas>
        <button onclick="exitToHub()" class="mt-4 bg-red-600 hover:bg-red-700 px-6 py-2 rounded font-bold transition">
            إنهاء اللعبة والعودة
        </button>
    </div>

    <script>
        // 📡 الاتصال التلقائي الديناميكي بنفس رابط موقع الـ Render الحالي لتجنب الـ CORS تماماً
        const socket = io(); 
        let myUsername = "";
        let currentGame = "";

        // دالة التنقل بين الشاشات بسلاسة
        function switchScreen(oldId, newId) {
            document.getElementById(oldId).classList.add('hidden');
            document.getElementById(newId).classList.remove('hidden');
        }

        // التعامل مع إنشاء الحساب وتسجيل الدخول
        function handleAuth(authType) {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if (!user || !pass) {
                alert("الرجاء إدخال اسم المستخدم وكلمة المرور!");
                return;
            }

            // إرسال البيانات للسيرفر
            socket.emit('authRequest', { type: authType, username: user, password: pass });
        }

        // استقبال رد السيرفر على الدخول
        socket.on('authResponse', (data) => {
            if (data.success) {
                myUsername = data.username;
                switchScreen('authScreen', 'gameHub');
            } else {
                alert(data.message);
            }
        });

        // تحديث قائمة المتصلين
        socket.on('updateOnlineUsers', (usersList) => {
            const container = document.getElementById('onlineUsersContainer');
            container.innerHTML = usersList.map(u => `<div class="flex items-center gap-2">🔹 ${u}</div>`).join('');
        });

        // إدارة غرف الانتظار
        function goToLobby(game) {
            currentGame = game;
            switchScreen('gameHub', 'lobbyArea');
            
            document.getElementById('snakeOnlineOptions').classList.add('hidden');
            document.getElementById('xoOptions').classList.add('hidden');

            if (game === 'snake') {
                document.getElementById('lobbyTitle').innerText = "🐍 لوي لعبة الدودة";
                document.getElementById('snakeOnlineOptions').classList.remove('hidden');
            } else {
                document.getElementById('lobbyTitle').innerText = "❌ XO لوي تحدي";
                document.getElementById('xoOptions').classList.remove('hidden');
            }
        }

        function exitToHub() {
            switchScreen('lobbyArea', 'gameHub');
            switchScreen('snakeCanvasArea', 'gameHub');
            currentGame = "";
        }

        // الشات العام
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if(msg) {
                socket.emit('sendGlobalCommunityMessage', { name: myUsername, msg: msg });
                input.value = "";
            }
        }

        socket.on('receiveGlobalCommunityMessage', (data) => {
            const box = document.getElementById('chatMessagesBox');
            box.innerHTML += `<div><strong class="text-blue-400">${data.name}:</strong> <span class="text-gray-100">${data.msg}</span></div>`;
            box.scrollTop = box.scrollHeight;
        });

        // ربط غرف الـ XO
        function joinXORoom() {
            const roomCode = document.getElementById('xoRoomCode').value.trim();
            if(!roomCode) { alert("أدخل كود الغرفة أولاً!"); return; }
            socket.emit('joinXOGame', { roomCode: roomCode, username: myUsername });
            alert(`تم طلب دخول الغرفة: ${roomCode} (يمكنك دمج لوحة اللعب الخاصة بك هنا)`);
        }

        // تشغيل لعبة الـ Snake
        function startSnakeGame() {
            switchScreen('lobbyArea', 'snakeCanvasArea');
            // هنا يمكنك استدعاء كود تشغيل لوحة الـ Canvas للعبة الدودة الخاصة بك بكل سهولة
        }
    </script>
</body>
</html>
